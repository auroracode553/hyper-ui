org.gradle.jvmargs=-Xms512m -Xmx4096m -XX:MaxMetaspaceSize=2g -XX:+UseParallelGC -Dfile.encoding=UTF-8 -Dkotlin.daemon.options=autoshutdownIdleSeconds=600

# 本机有 16 个逻辑线程；独立任务按依赖图并行，复用守护进程与增量缓存。
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.workers.max=16
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.vfs.watch=true
kotlin.incremental=true
# Kotlin/Wasm 与多平台编译分别有独立的增量开关。
kotlin.incremental.js=true
kotlin.incremental.multiplatform=true
kapt.incremental.apt=false
# 编译器使用独立的 3GB 堆，避免与 Gradle 共用原有的 2GB 堆。
kotlin.compiler.execution.strategy=daemon
kotlin.daemon.jvmargs=-Xms256m -Xmx3072m -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=320m -XX:+UseParallelGC

kotlin.nodejs.download=false
kotlin.js.yarn=false

# JDK 25 is discovered from the environment; do not download toolchains automatically.
org.gradle.java.installations.auto-download=false
