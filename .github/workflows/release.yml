name: Auto Tag & Release

# 推送代码到 main 即自动发布：
#   基于最新 tag 自增 patch 版本（1.0.0 → 1.0.1）→ 创建 tag + GitHub Release → 触发 JitPack 构建
on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算下一个自增 tag
        id: tag
        run: |
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          echo "当前最新 tag: $LATEST"
          VERSION=${LATEST#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          PATCH=$((PATCH + 1))
          NEXT="$MAJOR.$MINOR.$PATCH"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "下一个 tag: $NEXT"

      - name: 创建并推送 tag
        run: |
          TAG="${{ steps.tag.outputs.next }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: 创建 GitHub Release（触发 JitPack 构建）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.next }}
          name: ${{ steps.tag.outputs.next }}
          generate_release_notes: true

      - name: 触发 JitPack 构建
        run: |
          curl -sSL "https://jitpack.io/com/github/auroracode553/hyper-ui/${{ steps.tag.outputs.next }}/build.log" \
            || echo "已触发 JitPack 构建请求。"
