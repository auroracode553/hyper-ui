name: 部署 VitePress 到 GitHub Pages

on:
  push:
    branches:
      - "main"
    paths:
      - 'vitepress/docs/**'
      - 'vitepress/**'
      - 'preview/src/**'
      - 'library/src/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          # 启用 Gradle 缓存：自动缓存 Gradle 分发包和依赖，后续构建无需重复下载
          cache: gradle

      - name: 设置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vitepress/package-lock.json

      - name: 安装 VitePress 依赖
        working-directory: vitepress
        run: npm ci

      - name: 验证 Gradle Wrapper 完整性
        working-directory: preview
        run: |
          ls -la gradle/wrapper/
          file gradle/wrapper/gradle-wrapper.jar
          jar tf gradle/wrapper/gradle-wrapper.jar | grep -i manifest

      - name: 赋予 Gradle Wrapper 执行权限
        working-directory: preview
        run: chmod +x gradlew

      - name: GitHub Actions 使用官方 Gradle 分发包
        working-directory: preview
        run: |
          sed -i -E 's#^distributionUrl=.*gradle-([0-9.]+)-bin\.zip#distributionUrl=https\\://services.gradle.org/distributions/gradle-\1-bin.zip#' gradle/wrapper/gradle-wrapper.properties

      - name: 升级 Kotlin/Wasm npm 锁文件
        working-directory: preview
        run: ./gradlew kotlinWasmUpgradePackageLock --no-daemon

      - name: 构建 Wasm 预览产物
        working-directory: preview
        run: ./gradlew publishWasmToVitePress --no-daemon --stacktrace

      - name: 构建 VitePress
        working-directory: vitepress
        env:
          VITEPRESS_BASE: /hyper-ui/
        run: npm run build

      - name: 设置 Pages
        uses: actions/configure-pages@v5

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v4
        with:
          path: vitepress/.vitepress/dist

      - name: 部署到 GitHub Pages
        uses: actions/deploy-pages@v5
        id: deployment
