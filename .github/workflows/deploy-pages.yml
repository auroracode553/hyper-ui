name: 部署 VitePress 到 GitHub Pages

on:
  push:
    branches:
      - "main"
    paths:
      - 'vitepress/docs/**'
      - 'vitepress/**'
      - 'preview/src/**'
      - 'library/src/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vitepress/package-lock.json

      - name: 安装 VitePress 依赖
        working-directory: vitepress
        run: npm ci

      - name: 验证 Gradle Wrapper 完整性
        working-directory: preview
        run: |
          ls -la gradle/wrapper/
          file gradle/wrapper/gradle-wrapper.jar
          jar tf gradle/wrapper/gradle-wrapper.jar | grep -i manifest

      - name: 赋予 Gradle Wrapper 执行权限
        working-directory: preview
        run: chmod +x gradlew

      - name: 构建 Wasm 预览产物
        working-directory: preview
        run: ./gradlew publishWasmToVitePress --no-daemon --stacktrace

      - name: 构建 VitePress
        working-directory: vitepress
        env:
          VITEPRESS_BASE: /hyper-ui/
        run: npm run build

      - name: 设置 Pages
        uses: actions/configure-pages@v4

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: vitepress/.vitepress/dist

      - name: 部署到 GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
