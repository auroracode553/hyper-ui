# 本机构建预算：16 个逻辑线程，Gradle / Kotlin 堆上限分别为 4GB / 3GB。
# 不并发启动共享同一 HyperUI 输出目录的多个工程；工程内部按依赖图并行。
org.gradle.jvmargs=-Xms512m -Xmx4096m -XX:MaxMetaspaceSize=2g -XX:+UseParallelGC -Dfile.encoding=UTF-8 -Dkotlin.daemon.options=autoshutdownIdleSeconds=600
org.gradle.daemon=true
org.gradle.daemon.idletimeout=600000
org.gradle.parallel=true
org.gradle.workers.max=16
org.gradle.tooling.parallel=true

# 复用配置、任务产物和编译器，不取消正式包检查与优化。
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.vfs.watch=true
kotlin.incremental=true
kotlin.compiler.execution.strategy=daemon
kotlin.daemon.jvmargs=-Xms256m -Xmx3072m -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=320m -XX:+UseParallelGC

# 原有 Android、SDK 与代码风格设置。
android.useAndroidX=true
android.enableJetifier=false
kotlin.code.style=official
org.gradle.java.installations.auto-download=false
